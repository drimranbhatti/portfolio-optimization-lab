[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portopt"
version = "1.0.0"
description = "Portfolio construction lab: Markowitz, Black-Litterman, Kelly, risk parity, HRP and RMT covariance denoising"
authors = [{ name = "Dr. Muhammad Imran Bhatti" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.8", "seaborn>=0.13", "yfinance>=0.2.40", "jupyter"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
